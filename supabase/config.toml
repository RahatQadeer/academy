# A config file for Supabase local development / CLI.
# One shared project for the whole ecosystem. Do not create per-module projects.

project_id = "private-attache-system"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://private-attache-dun.vercel.app"
additional_redirect_urls = [
  "https://private-attache-dun.vercel.app/auth/callback",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/**",
]
jwt_expiry = 3600
enable_signup = true

[auth.email.template.invite]
subject = "You have been invited"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Your Magic Link"
content_path = "./supabase/templates/magic_link.html"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[storage]
enabled = true
file_size_limit = "50MiB"
